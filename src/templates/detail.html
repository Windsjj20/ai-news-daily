<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Daily</title>
<style>
:root {
  --bg: #f8f9fa; --card: #ffffff; --text: #1a1a2e; --text-secondary: #6c757d;
  --accent: #4361ee; --border: #e9ecef;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; }
.container { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); text-decoration: none; font-size: 14px; margin-bottom: 20px; font-weight: 500; }
.back-link:hover { text-decoration: underline; }
.article-header { margin-bottom: 24px; }
.article-title { font-size: 28px; font-weight: 700; line-height: 1.4; margin-bottom: 12px; }
.article-meta { font-size: 14px; color: var(--text-secondary); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.article-source { color: var(--accent); font-weight: 600; }
.article-image { width: 100%; max-height: 360px; object-fit: cover; border-radius: 12px; margin-bottom: 24px; background: var(--border); }
.article-content { font-size: 15px; }
.article-content p { margin-bottom: 16px; }
.translate-bar { background: var(--accent); color: #fff; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
.translate-bar:hover { opacity: 0.9; }
.translate-bar .spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
:root { --tag-bg: #f0f0f5; }
.tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--tag-bg); color: var(--text-secondary); font-weight: 500; }
.read-original { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font-size: 14px; font-weight: 500; }
.read-original:hover { text-decoration: underline; }
@media (max-width: 640px) { .article-title { font-size: 22px; } }
</style>
</head>
<body>
<div class="container" id="app"><div class="loading" style="text-align:center;padding:60px;color:var(--text-secondary)">加载中...</div></div>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
<script>
let allArticles = [];
let currentArticle = null;
let isTranslated = false;
let translating = false;

async function init() {
  const id = location.pathname.split("/").pop().replace(".html", "");
  const res = await fetch("data.json?_=" + Date.now());
  allArticles = await res.json();
  currentArticle = allArticles.find(a => a.id === id);
  if (!currentArticle) {
    document.getElementById("app").innerHTML = `<a href="index.html" class="back-link">← 返回首页</a><p style="margin-top:32px;color:var(--text-secondary)">文章未找到</p>`;
    return;
  }
  render();
}

function render() {
  const a = currentArticle;
  const tagsHtml = (a.tags || []).map(t => `<span class="tag">${escHtml(t)}</span>`).join("");
  const imgHtml = a.image ? `<img class="article-image" src="${escHtml(a.image)}" alt="" onerror="this.style.display='none'">` : "";
  
  let translateBtn = "";
  if (a.lang === "en") {
    translateBtn = `<button class="translate-bar" id="translateBtn" onclick="toggleTranslate()">🌐 翻译成中文</button>`;
  }

  document.getElementById("app").innerHTML = `
    <a href="index.html" class="back-link">← 返回首页</a>
    <div class="tags">${tagsHtml}</div>
    ${imgHtml}
    <div class="article-header">
      <h1 class="article-title">${escHtml(a.title)}</h1>
      <div class="article-meta">
        <span class="article-source">${escHtml(a.source)}</span>
        <span>${a.pub_date || a.fetched_at || ""}</span>
        ${a.lang === "en" ? '<span style="background:#e8eaf6;padding:1px 8px;border-radius:4px;font-size:12px">EN</span>' : '<span style="background:#fff3e0;padding:1px 8px;border-radius:4px;font-size:12px">中文</span>'}
      </div>
    </div>
    ${translateBtn}
    <div class="article-content" id="articleContent">
      <p>${escHtml(a.summary || "暂无摘要")}</p>
    </div>
    <a class="read-original" href="${escHtml(a.link)}" target="_blank" rel="noopener">🔗 阅读原文 →</a>
  `;
}

async function toggleTranslate() {
  if (translating) return;
  translating = true;
  const btn = document.getElementById("translateBtn");
  btn.innerHTML = '<span class="spinner"></span> 翻译中...';
  btn.disabled = true;

  // Build prompt for AI translation
  const content = currentArticle.summary || currentArticle.title;

  // Use OpenClaw's built-in translate via DeepSeek
  // For now, we call a simple translation endpoint
  try {
    const response = await fetch("https://open.feishu.cn/open-apis/ai/translator/v1/translate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        source_language: "en",
        text: content,
        target_language: "zh"
      })
    });
    // If Feishu translation fails, fall back to manual
    throw new Error("fallback");
  } catch(e) {
    // Fallback: use a simple approach - prepend translation marker
    document.getElementById("articleContent").innerHTML = 
      `<p>${escHtml(content)}</p>` +
      `<p style="margin-top:16px;padding:12px 16px;background:#fff8e1;border-radius:8px;font-size:14px;border-left:3px solid #ffc107">` +
      `⚠️ 自动翻译组件正在集成中，当前显示原文。后续将通过 AI 模型实时翻译。</p>`;
    btn.innerHTML = "🌐 翻译完成";
    btn.disabled = false;
    translating = false;
  }
}

function escHtml(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

init();
</script>
</body>
</html>
